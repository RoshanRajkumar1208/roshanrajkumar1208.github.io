<style>
/* Layout: the site is an API. Home = GET / with clickable endpoint tiles; each tile opens a section view.
   Two depths: Recruiter view (clean) and Engineer view (adds raw HTTP responses + technical detail). */
:root{
  --bg:#090b10; --surface:#11151f; --raise:#171c28; --ink:#e9ecf4; --muted:#9aa2b6; --line:#232a39;
  --accent:#8a92ff; --accent-soft:#1d2142; --accent-ink:#090b10; --hot:#ff5c8a;
  --ok:#43d39a; --ok-soft:#0f2a20; --pending:#f3b546; --pending-soft:#2c2210; --empty:#a3aabb; --empty-soft:#1c2130;
  --code-bg:#06070c; --code-ink:#dbe0f4; --code-dim:#7d86a6; --code-key:#a3abff; --code-str:#7fe2b9; --code-num:#ffc27a;
  --dot:rgba(138,146,255,.10);
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto}
.mono{font-family:var(--f-mono)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.bar .wrap{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.logo b{color:var(--accent)}
.cmd{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
.cmd label{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:700;white-space:nowrap}
.cmd input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--f-mono);font-size:13px;outline:none}
.cmd kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* cover: rotating quote over a drifting hex dump */
.cover{position:relative;overflow:hidden;margin:20px 0 0;border-radius:18px;border:1px solid var(--line);
  background:radial-gradient(120% 140% at 85% 10%,#1a1f4a 0%,var(--code-bg) 55%);min-height:250px;display:flex;align-items:flex-end}
.cover canvas{position:absolute;inset:0;width:100%;height:100%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--code-bg) 8%,transparent 70%);pointer-events:none}
.q{position:relative;z-index:1;padding:28px clamp(18px,4vw,40px) 26px;display:grid;gap:10px;max-width:880px;min-width:0}
.q .lbl{font-family:var(--f-mono);font-size:12px;color:var(--hot);letter-spacing:.08em;text-transform:uppercase}
.q blockquote{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.2vw,46px);line-height:1.05;letter-spacing:-.025em;color:#fff;text-wrap:balance;transition:opacity .45s,transform .45s}
.q blockquote.out{opacity:0;transform:translateY(8px)}
.q cite{font-style:normal;font-family:var(--f-mono);font-size:13px;color:var(--code-dim)}
.qdots{display:flex;gap:6px;margin-top:6px}
.qdots button{width:22px;height:4px;border:0;border-radius:3px;background:#2b3248;cursor:pointer;padding:0}
.qdots button[aria-current="true"]{background:var(--accent);width:36px}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-block:44px 40px;position:relative}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px;
  mask-image:linear-gradient(to bottom,#000 40%,transparent)}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);background:var(--ok-soft);padding:2px 9px;border-radius:99px;letter-spacing:.04em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,8vw,96px);line-height:.92;letter-spacing:-.035em;margin:18px 0 18px;text-wrap:balance}
h1 span{display:block;color:var(--accent)}
.lede{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:34ch;margin:0 0 26px}
.lede strong{color:var(--ink);font-weight:600}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px var(--f-body);padding:11px 18px;border-radius:10px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--surface);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{transform:translateY(-1px)}

/* http card */
.http{background:var(--code-bg);color:var(--code-ink);border-radius:var(--r);font-family:var(--f-mono);font-size:13.5px;line-height:1.7;
  box-shadow:0 30px 60px -30px rgba(16,19,40,.55);overflow:hidden;min-width:0}
.http-top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.07);color:var(--code-dim);font-size:12px}
.http-top i{width:10px;height:10px;border-radius:50%;background:#2a2f45}
.http-top span{margin-left:auto}
.http pre{margin:0;padding:16px 18px 20px;overflow-x:auto;white-space:pre}
.http .ln{display:block;animation:ln .35s both}
.http .m{color:var(--code-key);font-weight:700}.http .k{color:var(--code-key)}.http .s{color:var(--code-str)}.http .n{color:var(--code-num)}.http .d{color:var(--code-dim)}
.http .ok{color:#3ad69a;font-weight:700}
@keyframes ln{from{opacity:0;transform:translateX(-6px)}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--line);margin-bottom:44px}
.stat{padding:22px 18px 20px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(30px,4vw,42px);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}

/* endpoint grid */
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sec-h h2{font-family:var(--f-display);font-size:28px;letter-spacing:-.02em;margin:0;line-height:1.1}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:64px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;color:var(--ink);font:inherit;
  transition:transform .18s,border-color .18s,box-shadow .18s;min-width:0}
.tile:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 14px 30px -18px var(--accent)}
.tile .path{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.tile .path b{color:var(--accent);margin-right:6px}
.tile h3{font-family:var(--f-display);font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.1}
.tile p{margin:0;font-size:14px;color:var(--muted);flex:1}
.tile.big{grid-column:span 2}
.pill{align-self:flex-start;font-family:var(--f-mono);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.s2{color:var(--ok);background:var(--ok-soft)}.s202{color:var(--pending);background:var(--pending-soft)}.s204{color:var(--empty);background:var(--empty-soft)}

/* section view */
.view{padding-block:36px 72px}
.back{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-decoration:none;display:inline-flex;gap:6px;margin-bottom:22px}
.back:hover{color:var(--accent)}
.vhead{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;max-width:70ch}
.vhead .path{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.vhead .path b{color:var(--accent);margin-right:8px}
.vhead h2{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6vw,64px);letter-spacing:-.035em;line-height:.95;margin:0;text-wrap:balance}
.vhead p{color:var(--muted);font-size:18px;margin:0}
.hint{font-size:13.5px;color:var(--muted);background:var(--raise);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;align-self:flex-start}
.hint button{border:0;background:none;color:var(--accent);font:600 13.5px var(--f-body);cursor:pointer;padding:0;text-decoration:underline}
body.eng .hint{display:none}

.cards{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:14px;min-width:0}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}
.card h3{font-family:var(--f-display);font-size:26px;letter-spacing:-.02em;margin:0;line-height:1.1}
.card .sub{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-top:4px}
.card p{margin:0;max-width:68ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;padding:0;list-style:none}
.facts li{font-size:14px}.facts li span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:7px;background:var(--raise);border:1px solid var(--line);color:var(--ink)}
.card ul.pts{margin:0;padding-left:18px;max-width:68ch}.card ul.pts li{margin-bottom:4px}
.links{display:flex;gap:14px;flex-wrap:wrap;font-weight:600;font-size:14.5px}

.deep{display:none;border-top:1px dashed var(--line);padding-top:14px;gap:12px}
body.eng .deep{display:grid}
.deep h4{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0}
.deep p,.deep li{font-size:15px}

.todo{border:1.5px dashed var(--pending);background:var(--pending-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink)}
.todo b{font-family:var(--f-mono);font-size:11px;color:var(--pending);letter-spacing:.08em;display:block;margin-bottom:2px}
.todo ul{margin:0;padding-left:18px}

/* pipeline */
.pipe{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.step{flex:1 1 130px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;min-width:0}
.step b{display:block;font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-bottom:2px}
.arrow{align-self:center;font-family:var(--f-mono);color:var(--muted)}
.loop{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp > div{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14.5px}
.cmp b{font-family:var(--f-display);font-size:18px;display:block}

/* timeline */
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl .card{border:0;background:transparent;padding:4px 0 30px 26px;position:relative;border-radius:0}
.tl .card::before{content:"";position:absolute;left:-8px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.when{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:8px}
.stack > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack h4{margin:0 0 8px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
h3.group{font-family:var(--f-display);font-size:22px;margin:30px 0 12px;letter-spacing:-.02em}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:34px 24px;display:grid;gap:10px;max-width:70ch}
.empty .code{font-family:var(--f-mono);font-size:44px;font-weight:700;color:var(--empty);line-height:1}

.copy{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.copy code{font-family:var(--f-mono);font-size:15px;user-select:all;word-break:break-all}
.copy button{margin-left:auto}

.raw{display:none;margin-top:28px}
body.eng .raw{display:block}
.raw .http pre{max-height:420px;overflow:auto}

footer{border-top:1px solid var(--line);padding-block:22px 34px;color:var(--muted);font-size:13px;font-family:var(--f-mono);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:28px;padding-block:36px 28px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0;padding-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:520px){
  .grid{grid-template-columns:1fr}.tile.big{grid-column:auto}
  .cmp{grid-template-columns:1fr}.arrow{display:none}
  .cmd kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>html,body{margin:0}</style>

function hl(json){
  return json.replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(\d+)\b/g,(m,s,colon,n)=> s ? (colon?`<span class="k">${s}</span>${colon}`:`<span class="s">${s}</span>`) : `<span class="n">${n}</span>`);
}
function rawBlock(key){
  const s = SECTIONS[key]; const body = {};
  for (const [k,v] of Object.entries(s)) if (!["tile","big","draft"].includes(k)) body[k] = Array.isArray(v) ? visible(v).map(({deep,todo,draft,...rest})=>rest) : v;
  const json = JSON.stringify(body,null,2);
  return `<div class="raw"><div class="http"><div class="http-top"><i></i><i></i><i></i><span>raw response</span></div>
  <pre><span class="m">HTTP/1.1</span> <span class="${s.status===200?'ok':'n'}">${s.status} ${reason(s.status)}</span>
<span class="d">Content-Type: application/json
X-Content-Type-Options: nosniff
Content-Security-Policy: default-src 'self'</span>

${hl(json)}</pre></div></div>`;
}
function todoBox(t){ return SHOW_DRAFTS && t ? `<div class="todo"><b>BEFORE PUBLISHING</b><ul>${t.map(x=>`<li>${x}</li>`).join("")}</ul></div>` : ""; }

/* cover: quote rotation + hex-dump canvas */
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
let qi = 0, qTimer = null, raf = null;
function showQuote(i){
  qi = (i + QUOTES.length) % QUOTES.length;
  const qt = $("#qt"); if (!qt) return;
  qt.classList.add("out");
  setTimeout(() => {
    qt.textContent = QUOTES[qi][0]; $("#qby").textContent = "— " + QUOTES[qi][1];
    $("#qlbl").textContent = `// quote ${String(qi+1).padStart(2,"0")} of ${String(QUOTES.length).padStart(2,"0")}`;
    document.querySelectorAll("[data-q]").forEach((b,j) => b.setAttribute("aria-current", j===qi));
    qt.classList.remove("out");
  }, calm ? 0 : 420);
}
function startCover(){
  clearInterval(qTimer); cancelAnimationFrame(raf);
  qTimer = setInterval(() => showQuote(qi + 1), 6500);
  const c = $("#hex"); if (!c) return;
  const ctx = c.getContext("2d"), H = "0123456789abcdef", dpr = Math.min(devicePixelRatio || 1, 2);
  let w, h, cols, rows, grid, off = 0;
  const byte = () => H[Math.random()*16|0] + H[Math.random()*16|0];
  function size(){
    w = c.clientWidth; h = c.clientHeight; c.width = w*dpr; c.height = h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    cols = Math.ceil(w/26); rows = Math.ceil(h/18) + 2;
    grid = Array.from({length: rows}, () => Array.from({length: cols}, () => ({b: byte(), hot: Math.random() < .035})));
  }
  function draw(){
    ctx.clearRect(0,0,w,h); ctx.font = "12px 'JetBrains Mono', monospace";
    grid.forEach((row,r) => row.forEach((cell,k) => {
      const y = r*18 - off;
      ctx.fillStyle = cell.hot ? "rgba(255,92,138,.55)" : "rgba(138,146,255," + (0.07 + (k % 8 === 0 ? .06 : 0)) + ")";
      ctx.fillText(cell.b, k*26 + 8, y);
    }));
  }
  function tick(){
    off += 0.25;
    if (off >= 18){ off = 0; grid.shift(); grid.push(Array.from({length: cols}, () => ({b: byte(), hot: Math.random() < .035}))); }
    if (Math.random() < .3){ const r = grid[Math.random()*rows|0], k = Math.random()*cols|0; if (r && r[k]) r[k].b = byte(); }
    draw(); raf = requestAnimationFrame(tick);
  }
  size(); draw();
  if (!calm) raf = requestAnimationFrame(tick);
  window.onresize = () => { size(); draw(); fillLast(); };
}
/* stretch the last tile so the endpoint grid never ends on a half-empty row */
function fillLast(){
  const g = document.querySelector(".grid"); if (!g) return;
  const tiles = [...g.children]; tiles.forEach(t => t.style.gridColumn = "");
  const cols = getComputedStyle(g).gridTemplateColumns.split(" ").length; if (cols < 2) return;
  const span = t => t.classList.contains("big") ? Math.min(2, cols) : 1;
  let used = 0;
  tiles.forEach(t => { const sp = span(t); if (used + sp > cols) used = 0; used = (used + sp) % cols; });
  if (used > 0){ const last = tiles[tiles.length-1]; last.style.gridColumn = `span ${cols - used + span(last)}`; }
}

    ${body}
    ${rawBlock(key)}

  $("#foot").textContent = `HTTP/1.1 ${s.status} ${reason(s.status)}`;

  };

function notFound(path){

function render(){

function setMode(m){

}
